Categories:
  - Health Manager
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: UziKhan847
SourceCode: https://github.com/UziKhan847/simple_baby_tracker
IssueTracker: https://github.com/UziKhan847/simple_baby_tracker/issues

AutoName: Simple Baby Tracker

RepoType: git
Repo: https://github.com/UziKhan847/simple_baby_tracker.git

Builds:
  - versionName: 3.0.7
    versionCode: 307
    commit: v3.0.7
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v.*$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 3.0.7
CurrentVersionCode: 307
