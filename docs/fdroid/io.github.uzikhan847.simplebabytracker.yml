# DRAFT build recipe for F-Droid's fdroiddata repository
# (https://gitlab.com/fdroid/fdroiddata → metadata/<applicationId>.yml).
# It is NOT used by this project's own build; copy it into a fork of
# fdroiddata, open a merge request, and expect the reviewers to tweak it
# (they keep Flutter recipes consistent).
#
# Before submitting: tag the release to match pubspec.yaml, e.g. for
# `version: 3.0.6+306` →  git tag v3.0.6 && git push origin v3.0.6

Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: UziKhan847
WebSite: https://github.com/UziKhan847/simple_baby_tracker
SourceCode: https://github.com/UziKhan847/simple_baby_tracker
IssueTracker: https://github.com/UziKhan847/simple_baby_tracker/issues

AutoName: Simple Baby Tracker

RepoType: git
Repo: https://github.com/UziKhan847/simple_baby_tracker.git

Builds:
  - versionName: 3.0.6
    versionCode: 306
    commit: v3.0.6
    # Only the Android project is built; the desktop/iOS/web scaffolding
    # (generated by `flutter create`) isn't needed.
    rm:
      - ios
      - macos
      - linux
      - windows
      - web
    srclibs:
      - flutter@3.47.5
    output: build/app/outputs/flutter-apk/app-release.apk
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 3.0.6
CurrentVersionCode: 306
