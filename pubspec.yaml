name: simple_baby_tracker
description: "A new Flutter project."

publish_to: 'none' 

version: 3.0.3+303

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:  
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  intl: ^0.20.2
  uuid: ^4.5.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_launcher_icons: ^0.14.4
  file_selector: ^1.0.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  archive: ^4.3.0
  home_widget: ^0.10.0
  fluttertoast: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    # `assets/` alone doesn't include subfolders — each icon style must be
    # listed explicitly.
    - assets/icons/line/
    - assets/icons/duo/
    - assets/icons/solid/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  
  
  
  
